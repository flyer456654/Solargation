---
deployment:
  tasks:
    - export DEPLOYPATH=/home4/arkinnov/public_html/solargation.com/

    # Confirm the deployment directory exists.
    - /bin/mkdir -p $DEPLOYPATH

    # Deploy the static website pages.
    - /bin/cp index.html $DEPLOYPATH
    - /bin/cp about-team.html $DEPLOYPATH
    - /bin/cp contact.html $DEPLOYPATH
    - /bin/cp crops.html $DEPLOYPATH
    - /bin/cp energy.html $DEPLOYPATH
    - /bin/cp landuse.html $DEPLOYPATH
    - /bin/cp news.html $DEPLOYPATH
    - /bin/cp wateruse.html $DEPLOYPATH

    # Deploy shared assets and server configuration.
    - /bin/cp -R assets $DEPLOYPATH
    - /bin/cp .htaccess $DEPLOYPATH
    - /bin/cp .nojekyll $DEPLOYPATH